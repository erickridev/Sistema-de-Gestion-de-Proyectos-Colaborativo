spring.application.name=Sistema-de-Gestion-de-Proyectos-Colaborativo

# Conexión a la base de datos proyectoapi
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyectoapi?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracion JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
